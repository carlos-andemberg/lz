<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volto Já · Luciano Zyzz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* Tela "Volto Já" · Luciano Zyzz · feita pra 2560x1440 (1440p) */
  :root{
    --panel:#0F182C;
    --ink:#04060C;
    --white:#F7F9FF;
    --muted:#A9B7D6;
    --red:#FF3B4E;
    --fire:#FF7A2F;
    --ember:#FFC94D;
    --cyan:#38D6FF;
    --violet:#7A5CFF;
    --beep:1.2s;
    --font:"Montserrat","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000}

  #stage{
    position:absolute;left:50%;top:50%;
    width:2560px;height:1440px;
    transform:translate(-50%,-50%);transform-origin:center;
    overflow:hidden;
    background:linear-gradient(112deg,#061734 0%,#07112A 30%,#0A0C1B 50%,#1C0A16 70%,#2E0A13 100%);
    font-family:var(--font);color:var(--white);
  }

  /* ---------- fundo: gelo (esq) x fogo (dir) ---------- */
  .glow{position:absolute;border-radius:50%;pointer-events:none}
  .glow.ice  {width:1600px;height:1600px;left:-640px;top:-660px;background:radial-gradient(circle,rgba(56,214,255,.30),rgba(56,214,255,0) 62%);animation:drift1 14s ease-in-out infinite alternate}
  .glow.blue {width:1500px;height:1500px;left:-360px;bottom:-860px;background:radial-gradient(circle,rgba(42,109,255,.30),rgba(42,109,255,0) 62%);animation:drift2 18s ease-in-out infinite alternate}
  .glow.fire {width:1800px;height:1800px;right:-760px;bottom:-800px;background:radial-gradient(circle,rgba(255,59,78,.38),rgba(255,59,78,0) 62%);animation:drift2 16s ease-in-out infinite alternate-reverse}
  .glow.ember{width:1300px;height:1300px;right:-260px;top:-760px;background:radial-gradient(circle,rgba(255,122,47,.22),rgba(255,122,47,0) 62%);animation:drift1 20s ease-in-out infinite alternate}
  @keyframes drift1{to{transform:translate(170px,120px) scale(1.08)}}
  @keyframes drift2{to{transform:translate(-160px,-110px) scale(1.1)}}

  .dots{position:absolute;left:-112px;top:-112px;right:-112px;bottom:-112px;background-size:56px 56px;animation:pan 9s linear infinite}
  .dots.l{background-image:radial-gradient(rgba(56,214,255,.22) 5px,transparent 5.6px);
    -webkit-mask-image:linear-gradient(105deg,#000 0%,rgba(0,0,0,.35) 26%,transparent 44%);
            mask-image:linear-gradient(105deg,#000 0%,rgba(0,0,0,.35) 26%,transparent 44%)}
  .dots.r{background-image:radial-gradient(rgba(255,59,78,.24) 5px,transparent 5.6px);
    -webkit-mask-image:linear-gradient(105deg,transparent 56%,rgba(0,0,0,.35) 74%,#000 100%);
            mask-image:linear-gradient(105deg,transparent 56%,rgba(0,0,0,.35) 74%,#000 100%)}
  @keyframes pan{to{transform:translate(56px,56px)}}

  .slash{position:absolute;left:1250px;top:-200px;width:220px;height:1840px;transform:rotate(12deg);pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(56,214,255,.14) 46%,rgba(255,59,78,.14) 54%,transparent)}

  #fx{position:absolute;inset:0;width:2560px;height:1440px;pointer-events:none}

  /* ---------- entrada ---------- */
  .pop{animation:pop .9s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d,0s)}
  @keyframes pop{from{opacity:0;transform:translateY(50px) scale(.92)}to{opacity:1;transform:none}}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- topo ---------- */
  .brand{position:absolute;left:120px;top:78px;display:flex;align-items:center;gap:44px}
  .avatar{position:relative;width:164px;height:164px;flex:none}
  .avatar::before{content:"";position:absolute;inset:-60px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,214,255,.32),rgba(255,59,78,.16) 45%,transparent 68%)}
  .avatar-ring{position:absolute;inset:-28px;animation:spin 14s linear infinite}
  .avatar-face{
    position:absolute;inset:0;border-radius:50%;overflow:hidden;
    background:linear-gradient(135deg,var(--cyan),var(--violet) 50%,var(--red));
    border:6px solid var(--white);display:grid;place-items:center;
  }
  .avatar-face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
  .avatar-face .mono{font-size:62px;font-weight:900;color:var(--white)}
  .brand-name{font-size:72px;font-weight:900;line-height:1;letter-spacing:-.01em}
  .brand-handle{margin-top:12px;font-size:34px;font-weight:600;display:flex;align-items:center;gap:14px;color:var(--muted)}
  .live-pill{
    display:flex;align-items:center;gap:14px;align-self:center;
    background:var(--red);color:var(--white);
    font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
    padding:16px 30px;border-radius:999px;
    box-shadow:6px 6px 0 var(--cyan);
  }
  .live-pill i{width:16px;height:16px;border-radius:50%;background:var(--white);animation:blink 1.2s steps(1) infinite}

  .topright{position:absolute;right:120px;top:106px;display:flex;gap:28px;align-items:center}
  .chip{
    display:flex;align-items:center;gap:16px;
    background:var(--panel);border:4px solid var(--white);border-radius:999px;
    padding:15px 32px;font-size:30px;font-weight:600;
    box-shadow:6px 6px 0 var(--red);
  }
  .chip b{font-weight:900;color:var(--red);letter-spacing:.08em}
  .chip .dot{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 0 6px rgba(255,59,78,.28);animation:blink 1.6s steps(1) infinite}
  .clock{
    background:var(--white);color:var(--ink);border-radius:999px;
    padding:11px 34px;font-size:48px;font-weight:800;line-height:1.2;
    box-shadow:6px 6px 0 var(--cyan);
  }
  .clock .sep{animation:blink 1s steps(1) infinite}

  /* ---------- título (estilo do banner: branco, contorno grosso, gelo/fogo por trás) ---------- */
  .title{position:absolute;left:112px;top:286px;font-weight:900;line-height:.9}
  .line{display:block;white-space:nowrap;font-size:310px}
  .l2{margin-left:200px;margin-top:26px}
  .ch{position:relative;display:inline-block;will-change:transform;animation:wave 3s ease-in-out infinite;animation-delay:calc(var(--i) * .11s)}
  .ch i{position:absolute;left:0;top:0;font-style:normal;-webkit-text-stroke:28px currentColor}
  .ch .c1{color:var(--cyan);transform:translate(-14px,16px)}
  .ch .c2{color:var(--red);transform:translate(14px,16px)}
  .ch .ol{color:var(--ink)}
  .ch b{position:relative;font-weight:inherit;color:var(--white)}
  .l2 .ch b{background:linear-gradient(180deg,#FFE27A 8%,#FF9A3C 45%,#FF3B4E 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
  @keyframes wave{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-24px) rotate(-2deg)}}

  .promise{
    font-size:44px;font-weight:800;color:var(--ink);
    background:var(--white);border:5px solid var(--ink);border-radius:22px;
    padding:12px 28px;
    box-shadow:0 0 0 7px var(--white), 10px 12px 0 7px var(--cyan);
  }

  /* ---------- mensagem ---------- */
  .msg{
    position:absolute;left:120px;top:926px;width:1180px;height:100px;
    display:flex;align-items:center;gap:26px;padding:0 40px 0 16px;
    background:var(--panel);border:5px solid var(--white);border-radius:999px;
    box-shadow:10px 10px 0 var(--red);
  }
  .msg-tag{
    flex:none;background:var(--red);color:var(--white);
    font-size:26px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;
    padding:15px 26px;border-radius:999px;
  }
  .msg-text{font-size:40px;font-weight:600;white-space:nowrap;overflow:hidden}
  .caret{display:inline-block;width:6px;height:44px;background:var(--cyan);margin-left:6px;vertical-align:-7px;border-radius:3px;animation:blink 1s steps(1) infinite}

  /* ---------- spike / contador ---------- */
  .spike{
    position:absolute;left:120px;top:1078px;width:1180px;height:196px;
    display:flex;align-items:center;gap:38px;padding:0 48px 0 30px;
    background:var(--panel);border:5px solid var(--white);border-radius:44px;
    box-shadow:12px 12px 0 var(--cyan);
  }
  .spike-icon{
    position:relative;width:132px;height:132px;flex:none;border-radius:50%;
    background:var(--red);border:5px solid var(--white);display:grid;place-items:center;
    transition:background .4s;
  }
  .spike-icon::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:6px solid var(--red);animation:ping var(--beep) ease-out infinite;
  }
  @keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.55);opacity:0}}
  .spike-mid{flex:1;min-width:0}
  .spike-label{font-size:28px;font-weight:900;letter-spacing:.18em;color:var(--red);text-transform:uppercase}
  .spike-sub{font-size:36px;font-weight:700;margin-top:4px;white-space:nowrap}
  .bar{margin-top:18px;height:38px;border-radius:999px;border:4px solid var(--white);background:#070C18;overflow:hidden;position:relative}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;min-width:30px;border-radius:999px;overflow:hidden;
    background:linear-gradient(90deg,var(--ember),var(--fire) 45%,var(--red))}
  .fill::before{
    content:"";position:absolute;top:0;bottom:0;left:-46px;right:0;
    background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 16px,transparent 16px 32px);
    animation:stripes 1s linear infinite;
  }
  @keyframes stripes{to{transform:translateX(45.25px)}}
  .timer{font-size:112px;font-weight:800;line-height:1;display:flex;flex:none}
  .timer .d{display:inline-block;width:.64em;text-align:center}
  .timer .c{display:inline-block;width:.3em;text-align:center}
  .timer .ja{color:var(--cyan);animation:wave 1.4s ease-in-out infinite}

  .spike.done .spike-icon{background:var(--cyan)}
  .spike.done .fill{background:linear-gradient(90deg,#9BEBFF,var(--cyan))}
  .spike.done .spike-icon::after{border-color:var(--cyan)}
  .spike.done .spike-label{color:var(--cyan)}
  .spike.free .timer{display:none}
  .spike.free .fill{width:34% !important;animation:roam 2.4s ease-in-out infinite alternate}
  @keyframes roam{from{left:0}to{left:66%}}

  /* ---------- janela / mascote ---------- */
  .window{position:absolute;left:1446px;top:250px;width:984px;height:984px}
  .win{
    width:100%;height:100%;transform:rotate(2deg);
    background:#0B1224;border:7px solid var(--white);border-radius:46px;
    box-shadow:20px 20px 0 var(--red);overflow:hidden;
    display:flex;flex-direction:column;
  }
  .win-bar{
    height:98px;flex:none;border-bottom:6px solid var(--white);
    background:linear-gradient(90deg,#16B4EC 0%,var(--violet) 52%,var(--red) 100%);
    display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 120px;
  }
  .win-title{color:var(--white);font-size:36px;font-weight:800;display:flex;align-items:center;gap:16px;text-shadow:3px 3px 0 rgba(4,6,12,.35)}
  .win-btns{display:flex;gap:16px}
  .win-btns i{width:34px;height:34px;border-radius:50%;border:5px solid var(--ink);background:var(--white)}
  .win-btns i:first-child{background:var(--ember)}
  .win-body{
    position:relative;flex:1;overflow:hidden;
    background:
      radial-gradient(circle at 26% 88%,rgba(56,214,255,.30),transparent 42%),
      radial-gradient(circle at 78% 22%,rgba(255,59,78,.30),transparent 45%),
      radial-gradient(rgba(255,255,255,.07) 4px,transparent 4.6px) 0 0/48px 48px,
      #0B1224;
  }
  .mascot{position:absolute;left:52%;bottom:96px;width:600px;transform:translateX(-50%)}
  .speech{
    position:absolute;left:54px;top:64px;max-width:420px;
    background:var(--white);color:var(--ink);border:5px solid var(--ink);border-radius:30px;
    padding:18px 28px;font-size:34px;font-weight:800;line-height:1.15;
    box-shadow:8px 8px 0 var(--cyan);
    transform:rotate(-4deg);transform-origin:80% 100%;animation:talk 4s ease-in-out infinite;
  }
  .speech::after{
    content:"";position:absolute;right:54px;bottom:-30px;width:34px;height:34px;
    background:var(--white);border-right:5px solid var(--ink);border-bottom:5px solid var(--ink);
    transform:rotate(45deg) skew(12deg,12deg);
  }
  @keyframes talk{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-2deg) translateY(-6px)}}
  .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
  .bubble{transform-box:fill-box;transform-origin:10% 60%;animation:bubble 4s ease-in-out infinite}
  @keyframes bubble{0%{transform:scale(.15);opacity:1}68%{transform:scale(1.1);opacity:1}76%{transform:scale(1.4);opacity:0}100%{transform:scale(.15);opacity:0}}
  .halo{transform-box:fill-box;transform-origin:center;animation:halo var(--beep) ease-out infinite}
  @keyframes halo{from{transform:scale(.55);opacity:.8}to{transform:scale(1.6);opacity:0}}
  .led{animation:led 1.8s ease-in-out infinite}
  @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}

  .zs{position:absolute;left:650px;top:400px;width:10px;height:10px}
  .zs span{
    position:absolute;left:0;bottom:0;font-weight:900;font-size:92px;line-height:1;
    opacity:0;animation:zfloat 8s ease-out infinite;
    -webkit-text-stroke:5px var(--ink);text-shadow:6px 7px 0 var(--ink);
  }
  .zs span:nth-child(1){color:var(--white);animation-delay:0s}
  .zs span:nth-child(2){color:var(--cyan);animation-delay:1s}
  .zs span:nth-child(3){color:var(--red);animation-delay:2s}
  .zs span:nth-child(4){color:var(--ember);animation-delay:3s}
  @keyframes zfloat{
    0%{opacity:0;transform:translate(0,0) scale(.35) rotate(-12deg)}
    8%{opacity:1}
    30%{transform:translate(90px,-120px) scale(.8) rotate(8deg)}
    52%{opacity:1}
    62%{opacity:0;transform:translate(210px,-300px) scale(1.15) rotate(-6deg)}
    100%{opacity:0;transform:translate(210px,-300px) scale(1.15) rotate(-6deg)}
  }

  .win-status{
    position:absolute;left:0;right:0;bottom:0;height:86px;
    border-top:5px solid var(--white);background:#070B16;
    display:flex;align-items:center;justify-content:space-between;padding:0 190px 0 40px;
    font-size:30px;font-weight:600;color:#D5DEF3;
  }
  .win-status .st{display:flex;align-items:center;gap:16px}
  .win-status .st i{width:18px;height:18px;border-radius:50%;background:var(--red);animation:blink 1.4s steps(1) infinite}
  .eq{display:flex;align-items:flex-end;gap:7px;height:34px}
  .eq b{width:9px;border-radius:5px;background:var(--white);height:100%;transform-origin:bottom;animation:eq 1s ease-in-out infinite}
  .eq b:nth-child(2){animation-delay:.2s;background:var(--red)}
  .eq b:nth-child(3){animation-delay:.45s}
  .eq b:nth-child(4){animation-delay:.1s;background:var(--cyan)}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}

  /* ---------- adesivos ---------- */
  .stk{position:absolute}
  .stk-in{animation:bob var(--dur,5s) ease-in-out infinite;animation-delay:var(--del,0s);transform:rotate(var(--r,0deg))}
  .stk svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(6px 9px 0 rgba(0,0,0,.45))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-20px) rotate(calc(var(--r,0deg) + 5deg))}}
  .o{fill:none;stroke:var(--white);stroke-width:24;stroke-linejoin:round;stroke-linecap:round}
  .f{stroke:var(--ink);stroke-width:7;stroke-linejoin:round;stroke-linecap:round}
  .tag{
    font-weight:900;letter-spacing:.04em;line-height:1;text-align:center;
    border:6px solid var(--ink);border-radius:26px;padding:16px 26px 14px;
    box-shadow:0 0 0 8px var(--white), 10px 13px 0 8px rgba(0,0,0,.45);
  }

  /* ---------- faixa de baixo ---------- */
  .ticker{
    position:absolute;left:0;right:0;bottom:0;height:116px;
    background:#04060C;overflow:hidden;display:flex;align-items:center;
  }
  .ticker::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--cyan),var(--violet) 50%,var(--red))}
  .track{display:flex;flex:none;white-space:nowrap;animation:marquee 48s linear infinite;padding-top:8px}
  .track .it{
    display:flex;align-items:center;gap:44px;padding-right:44px;
    font-size:40px;font-weight:800;color:var(--white);letter-spacing:.06em;text-transform:uppercase;
  }
  .track .it em{font-style:normal;color:var(--cyan)}
  .track .it strong{font-weight:800;color:var(--red)}
  .track svg{width:34px;height:34px;flex:none}
  @keyframes marquee{to{transform:translateX(-50%)}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="p-spark" d="M50 4 C54 34 66 46 96 50 C66 54 54 66 50 96 C46 66 34 54 4 50 C34 46 46 34 50 4Z"/>
    <path id="p-heart" d="M50 88 C20 66 6 50 6 32 C6 18 17 8 30 8 C39 8 46 13 50 20 C54 13 61 8 70 8 C83 8 94 18 94 32 C94 50 80 66 50 88Z"/>
    <g id="p-cross"><path d="M50 6V34M50 66V94M6 50H34M66 50H94"/><path d="M50 50h0.01"/></g>
    <linearGradient id="g-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38D6FF"/><stop offset=".5" stop-color="#7A5CFF"/><stop offset="1" stop-color="#FF3B4E"/>
    </linearGradient>
  </defs>
</svg>

<div id="stage">
  <div class="glow ice"></div>
  <div class="glow blue"></div>
  <div class="glow fire"></div>
  <div class="glow ember"></div>
  <div class="dots l"></div>
  <div class="dots r"></div>
  <div class="slash"></div>
  <canvas id="fx" width="2560" height="1440"></canvas>

  <!-- canal -->
  <header class="brand pop" style="--d:.05s">
    <div class="avatar">
      <svg class="avatar-ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle cx="110" cy="110" r="104" fill="none" stroke="url(#g-ring)" stroke-width="6" stroke-linecap="round" stroke-dasharray="44 16"/>
      </svg>
      <div class="avatar-face">
        <span class="mono">LZ</span>
        <img src="assets/logo.png" alt="" onerror="this.remove()">
      </div>
    </div>
    <div>
      <div class="brand-name">Luciano Zyzz</div>
      <div class="brand-handle">
        <svg width="46" height="32" viewBox="0 0 46 32" aria-hidden="true"><rect width="46" height="32" rx="9" fill="#FF3B4E"/><path d="M18 9 L31 16 L18 23Z" fill="#F7F9FF"/></svg>
        @Luciano-Zyzz
      </div>
    </div>
    <div class="live-pill"><i></i>pausa rápida</div>
  </header>

  <div class="topright pop" style="--d:.15s">
    <div class="chip"><span class="dot"></span>jogando <b id="game">VALORANT</b></div>
    <div class="clock" id="clock">--<span class="sep">:</span>--</div>
  </div>

  <!-- título -->
  <h1 class="title pop" style="--d:.25s" aria-label="Volto já!">
    <span class="line l1" data-text="VOLTO"></span>
    <span class="line l2" data-text="JÁ!"></span>
  </h1>

  <div class="stk pop" style="--d:.9s;left:862px;top:668px">
    <div class="promise stk-in" style="--r:-7deg;--dur:4s">prometo!</div>
  </div>

  <!-- mensagem que vai trocando -->
  <div class="msg pop" style="--d:.45s">
    <span class="msg-tag">enquanto isso</span>
    <span class="msg-text"><span id="typed"></span><span class="caret"></span></span>
  </div>

  <!-- contador estilo spike -->
  <div class="spike pop" id="spike" style="--d:.55s">
    <div class="spike-icon">
      <svg viewBox="0 0 100 100" width="78" aria-hidden="true">
        <path d="M50 24 V12" stroke="#04060C" stroke-width="7" stroke-linecap="round"/>
        <circle cx="50" cy="10" r="7" fill="#F7F9FF" stroke="#04060C" stroke-width="5"/>
        <path d="M20 86 C20 58 26 26 50 24 C74 26 80 58 80 86 Z" fill="#F7F9FF" stroke="#04060C" stroke-width="7" stroke-linejoin="round"/>
        <path d="M25 50 H75" stroke="#04060C" stroke-width="7"/>
        <path d="M22 72 H78" stroke="#04060C" stroke-width="7"/>
      </svg>
    </div>
    <div class="spike-mid">
      <div class="spike-label" id="spikeLabel">spike plantada</div>
      <div class="spike-sub" id="spikeSub">volto antes de explodir!</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
    </div>
    <div class="timer" id="timer"></div>
  </div>

  <!-- janela com o mascote -->
  <div class="window pop" style="--d:.35s">
    <div class="win">
      <div class="win-bar">
        <span class="win-title">
          <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true"><use href="#p-spark" fill="#F7F9FF"/></svg>
          luciano_zyzz.exe

<script>
  /* ================== CONFIGURAÇÃO ==================
     Dá pra trocar pela URL também, sem mexer aqui:
       volto-ja.html?min=10          -> contador de 10 minutos (0 = sem contador)
       volto-ja.html?jogo=WARZONE    -> muda o "jogando ..."
  */
  const CONFIG = {
    minutos: 20,
    jogo: "VALORANT",
    mensagens: [
      "fui pegar uma água, já volto",
      "comprando skin na loja (de novo)",
      "alongando o pulso pro clutch",
      "ajustando a sensi pela 47ª vez",
      "chama a galera pro chat!",
      "deixa o like e se inscreve",
      "se eu demorar, culpa do duelista",
      "treinando mira no range, confia",
    ],
    faixa: [
      "youtube.com/<em>@Luciano-Zyzz</em>",
      "entra no discord <em>discord.gg/4Ykg8jceN8</em>",
      "<strong>valorant</strong> quase todo dia",
      "deixa o like",
      "se inscreve no canal",
      "league of legends",
      "cod warzone",
    ],
  };

  const stage = document.getElementById('stage');
  const params = new URLSearchParams(location.search);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* encaixa 2560x1440 em qualquer janela (no OBS fica 1:1) */
  function fit(){
    const s = Math.min(innerWidth / 2560, innerHeight / 1440);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* título: cada letra ganha contorno + sombra gelo/fogo */
  let li = 0;
  document.querySelectorAll('.title .line').forEach(line => {
    line.innerHTML = [...line.dataset.text].map(ch =>
      `<span class="ch" style="--i:${li++}"><i class="c1">${ch}</i><i class="c2">${ch}</i><i class="ol">${ch}</i><b>${ch}</b></span>`
    ).join('');
  });

  /* jogo */
  document.getElementById('game').textContent = (params.get('jogo') || CONFIG.jogo).toUpperCase();

  /* relógio */
  const clock = document.getElementById('clock');
  function tickClock(){
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    clock.innerHTML = `${hh}<span class="sep">:</span>${mm}`;
  }
  tickClock(); setInterval(tickClock, 5000);

  /* faixa de baixo */
  const star = c => `<svg viewBox="0 0 100 100"><use href="#p-spark" fill="${c}"/></svg>`;
  const starColors = ['#FF3B4E', '#38D6FF', '#FFC94D'];
  const group = CONFIG.faixa.map((t, i) => `<span class="it"><span>${t}</span>${star(starColors[i % 3])}</span>`).join('');
  document.getElementById('track').innerHTML = group + group;

  /* mensagens digitando */
  const typed = document.getElementById('typed');
  (async function typeLoop(){
    await sleep(1200);
    for (let i = 0; ; i++){
      const t = CONFIG.mensagens[i % CONFIG.mensagens.length];
      for (let k = 1; k <= t.length; k++){ typed.textContent = t.slice(0, k); await sleep(40 + Math.random() * 45); }
      await sleep(2800);
      for (let k = t.length; k >= 0; k--){ typed.textContent = t.slice(0, k); await sleep(18); }
      await sleep(380);
    }
  })();

  /* contador estilo spike */
  const minutos = params.has('min') ? Math.max(0, parseFloat(params.get('min')) || 0) : CONFIG.minutos;
  const total = minutos * 60 * 1000;
  const start = Date.now();
  const spike = document.getElementById('spike');
  const fill = document.getElementById('fill');
  const timer = document.getElementById('timer');
  const label = document.getElementById('spikeLabel');
  const sub = document.getElementById('spikeSub');
  let lastText = '', lastBeep = '';

  const digits = s => [...s].map(ch => ch === ':' ? '<span class="c">:</span>' : `<span class="d">${ch}</span>`).join('');

  const speech = document.getElementById('speech');
  speech.textContent = minutos === 0 ? 'só um minutinho...'
    : minutos <= 1 ? 'só mais 1 minutinho...'
    : `só mais ${Math.round(minutos)} minutinhos...`;

  if (total === 0){
    spike.classList.add('free');
    label.textContent = 'recarregando';
    sub.textContent = 'já já tô de volta!';
  } else {
    (function tick(){
      const left = Math.max(0, total - (Date.now() - start));
      const pct = 1 - left / total;
      fill.style.width = (pct * 100).toFixed(3) + '%';

      /* a spike bipa mais rápido perto do fim */
      const beep = pct < .5 ? '1.2s' : pct < .75 ? '.85s' : pct < .9 ? '.55s' : '.3s';
      if (beep !== lastBeep){ stage.style.setProperty('--beep', beep); lastBeep = beep; }

      if (left === 0){
        spike.classList.add('done');
        stage.style.setProperty('--beep', '1.6s');
        label.textContent = 'spike defusada';
        sub.textContent = 'voltando agora mesmo!';
        timer.innerHTML = '<span class="ja">JÁ!</span>';
        return;
      }
      const secs = Math.ceil(left / 1000);
      const txt = String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0');
      if (txt !== lastText){ timer.innerHTML = digits(txt); lastText = txt; }
      requestAnimationFrame(tick);
    })();
  }

  /* partículas: brasas subindo no lado do fogo, neve caindo no lado do gelo */
  const cv = document.getElementById('fx');
  const ctx = cv.getContext('2d');
  function sprite(r, g, b){
    const R = 32, c = document.createElement('canvas');
    c.width = c.height = R * 2;
    const x = c.getContext('2d');
    const grd = x.createRadialGradient(R, R, 0, R, R, R);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(.18, `rgba(${r},${g},${b},.95)`);
    grd.addColorStop(.45, `rgba(${r},${g},${b},.28)`);
    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = grd; x.fillRect(0, 0, R * 2, R * 2);
    return c;
  }
  const fireSprites = [sprite(255,201,77), sprite(255,122,47), sprite(255,59,78)];
  const iceSprites  = [sprite(56,214,255), sprite(181,242,255), sprite(120,160,255)];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function spawn(p, fresh){
    const fire = p.fire;
    p.x = fire ? rnd(1250, 2600) : rnd(-100, 1350);
    p.y = fresh ? rnd(0, 1440) : (fire ? rnd(1450, 1560) : rnd(-120, -20));
    p.s = rnd(12, 38);                                  // tamanho do brilho
    p.vy = fire ? -rnd(40, 120) : rnd(30, 90);          // px/s
    p.vx = fire ? rnd(-15, 15) : rnd(10, 60);
    p.sw = rnd(20, 60); p.ph = rnd(0, 6.28); p.fs = rnd(.6, 1.6);
    p.a = rnd(.35, .9);
    p.img = (fire ? fireSprites : iceSprites)[Math.floor(Math.random() * 3)];
  }
  const parts = [];
  for (let i = 0; i < 180; i++){ const p = { fire: i % 2 === 0 }; spawn(p, true); parts.push(p); }
  let last = performance.now();
  (function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const t = now / 1000;
    ctx.clearRect(0, 0, 2560, 1440);
    ctx.globalCompositeOperation = 'lighter';
    for (const p of parts){
      p.y += p.vy * dt;
      p.x += p.vx * dt;
      if (p.fire ? p.y < -60 : p.y > 1500) spawn(p, false);
      const flick = p.fire ? .6 + .4 * Math.sin(t * 7 * p.fs + p.ph) : .7 + .3 * Math.sin(t * 2.5 * p.fs + p.ph);
      const x = p.x + Math.sin(t * p.fs + p.ph) * p.sw;
      ctx.globalAlpha = p.a * flick;
      ctx.drawImage(p.img, x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    requestAnimationFrame(frame);
  })(last);
</script>
